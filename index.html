<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EYSLabs - Instant QR Code Generator</title>
    <!-- Tailwind CSS (Tasarım için) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Code Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* Modern ve temiz yazı tipi */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Arka plan gradyanı */
        .bg-pattern {
            background-color: #0f172a; /* bg-gray-900 */
            background-image: 
                radial-gradient(at 10% 10%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
        }

        /* Hover efekti için parlama */
        .glow-on-hover:hover {
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        }
    </style>
</head>
<body class="bg-pattern text-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Ana Konteyner -->
    <div class="max-w-xl w-full bg-gray-800/60 backdrop-blur-lg rounded-3xl shadow-[0_0_60px_-15px_rgba(0,0,0,0.7)] p-8 border border-gray-700/50">
        
        <!-- Üst Başlık ve Logo Alanı -->
        <div class="flex items-center justify-center gap-3 mb-8">
            <!-- EYSLabs Vurgusu - Burayı kendi logonla değiştirebilirsin -->
            <div class="w-12 h-12 bg-indigo-600 rounded-full flex items-center justify-center font-bold text-3xl text-white shadow-lg shadow-indigo-500/30">
                E
            </div>
            <div class="text-center">
                <h1 class="text-3xl font-extrabold text-white tracking-tight">
                    Quick<span class="text-indigo-400">QR</span> Generator
                </h1>
                <p class="text-gray-400 text-sm">Create beautiful, instant QR codes for free.</p>
            </div>
        </div>

        <!-- Girdi Alanı (Input) -->
        <div class="space-y-3 mb-6">
            <label class="block text-sm font-semibold text-gray-300">Enter your link or text below</label>
            <div class="relative">
                <input type="text" id="text-input" placeholder="https://eyslabs.com" 
                    class="w-full p-4 pl-12 rounded-xl bg-gray-900 text-white border border-gray-700/50 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-lg placeholder-gray-600">
                <!-- Sol taraftaki ikon -->
                <svg class="absolute left-4 top-4 h-6 w-6 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
                </svg>
            </div>
        </div>

        <!-- Oluştur Butonu -->
        <button onclick="generateQR()" 
            class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold py-4 rounded-xl shadow-lg transition duration-300 transform hover:scale-[1.02] hover:from-indigo-500 hover:to-purple-500 active:scale-[0.98] focus:ring-4 focus:ring-indigo-500/40 glow-on-hover text-lg">
            Generate My QR Code
        </button>

        <!-- Çıktı Alanı (QR Kod) - Animasyonlu açılır -->
        <div id="qrcode-container" class="mt-10 pt-8 border-t border-gray-700/50 flex flex-col items-center hidden transform transition-all duration-500 ease-out opacity-0 translate-y-4">
            
            <div class="relative bg-white p-6 rounded-3xl shadow-[0_0_40px_-10px_rgba(0,0,0,0.5)] border-4 border-gray-100 mb-5">
                <div id="qrcode"></div>
                <!-- Ortada küçük bir 'E' işareti (Logo efekti) -->
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center font-bold text-xl text-white shadow-md border-4 border-white">
                        E
                    </div>
                </div>
            </div>

            <p class="text-sm text-gray-400 mb-2">Code ready! Use below option or right-click to save.</p>
            
            <!-- İndirme Butonu -->
            <button onclick="downloadQR()" 
                class="bg-gray-700 hover:bg-gray-600 text-white font-semibold py-2 px-6 rounded-full text-sm transition flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Download PNG
            </button>
        </div>
    </div>

    <!-- Alt Bilgi -->
    <footer class="mt-12 text-gray-600 text-xs text-center">
        &copy; 2024 EYSLabs. A product of micro-engineering. No data stored.
    </footer>

    <!-- Scriptler -->
    <script>
        let qrcode = null;

        function generateQR() {
            const text = document.getElementById("text-input").value;
            const container = document.getElementById("qrcode-container");
            const qrcodeDiv = document.getElementById("qrcode");

            if (!text.trim()) {
                alert("Hoop kirwe, geçerli bir link veya metin girmedin!");
                return;
            }

            // Önce temizle
            qrcodeDiv.innerHTML = "";
            
            // Konteyneri göster (Animasyon için önce 'hidden'ı kaldır, sonra efekti ekle)
            container.classList.remove("hidden");
            setTimeout(() => {
                container.classList.remove("opacity-0", "translate-y-4");
            }, 10);

            // QR Kod Oluştur (Modern görünüm için siyah/beyaz zıtlığı)
            qrcode = new QRCode(qrcodeDiv, {
                text: text,
                width: 256, // Daha yüksek kalite
                height: 256,
                colorDark : "#0f172a", // Çok koyu mavi
                colorLight : "#ffffff", // Beyaz
                correctLevel : QRCode.CorrectLevel.H // Yüksek hata düzeltme (Logo koymak için gerekli)
            });
        }

        // QR Kodu Görüntü Olarak İndirme Fonksiyonu
        function downloadQR() {
            const qrCanvas = document.querySelector('#qrcode canvas');
            if (!qrCanvas) return;

            const image = qrCanvas.toDataURL("image/png").replace("image/png", "image/octet-stream");
            const link = document.createElement('a');
            link.download = 'eyslabs-qr-code.png';
            link.href = image;
            link.click();
        }
    </script>
</body>
</html>
